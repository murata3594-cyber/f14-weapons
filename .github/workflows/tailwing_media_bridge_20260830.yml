name: Tailwing verified media bridge twelfth pass
on:
  push:
    paths:
      - '.github/workflows/tailwing_media_bridge_20260830.yml'
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Extract five-second QC map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/qc out/meta
          NASA='https://d2ol7oe51mr4n9.cloudfront.net/user_3IJiiIgecXaUy0qAi7prfFqLy4X/41359ac3-ea5e-4e8a-97d8-be7c0543ecba.mp4'
          curl -L --fail --retry 3 -o nasa_uas.mp4 "$NASA"
          for t in $(seq 0 5 220); do ffmpeg -y -loglevel error -ss "$t" -i nasa_uas.mp4 -frames:v 1 -vf 'scale=640:-2' -q:v 3 "out/qc/NASA_MAP_${t}.jpg"; done
          printf '%s\n' 'Five-second frame map of NASA Armstrong verified official UAS video Hbm2FCt9pHc. Use only to locate an exact X-36/GCS sequence.' > out/meta/README.txt
          find out -maxdepth 2 -type f -printf '%p\t%s bytes\n' | sort
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailwing-twelfth-pass-map
          path: out/
          compression-level: 0
          retention-days: 1
