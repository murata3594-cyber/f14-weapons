name: Tailwing verified media bridge twenty-first pass
on:
  push:
    paths:
      - '.github/workflows/tailwing_media_bridge_20260830.yml'
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install media tools
        run: python -m pip install -q -U yt-dlp
      - name: Acquire alternate real crosswind candidates
        shell: bash
        run: |
          set -u
          mkdir -p out/videos out/images out/meta
          yt-dlp --no-playlist -f 'best[height<=1080]/best' -o 'out/videos/VID_MERCEDES_SPRINTER_ASSIST_SYSTEMS_DAILYMOTION_RIGHTS_CHECK.%(ext)s' 'https://www.dailymotion.com/video/x6nsw5b' || true
          yt-dlp --no-playlist -f 'best[height<=1080]/best' -o 'out/videos/VID_MERCEDES_CROSSWIND_ASSIST_VIMEO_RIGHTS_CHECK.%(ext)s' 'https://vimeo.com/133792996' || true
          curl -L --retry 3 -A 'Mozilla/5.0' -sS -o 'out/images/MERCEDES_SPRINTER_CROSSWIND_REAL_TEST_MOTORBOX_RIGHTS_CHECK.jpg' 'https://media.motorbox.com/image/mercedes-crosswind-assist/4/0/7/407232/407232-16x9-lg.jpg' || true
          curl -L --retry 3 -A 'Mozilla/5.0' -sS -o 'out/images/MERCEDES_SPRINTER_CROSSWIND_DEMO_FLEETOWNER_RIGHTS_CHECK.png' 'https://img.fleetowner.com/files/base/ebm/fleetowner/image/2019/04/fleetowner_12636_crossopen.png?auto=format%2Ccompress&fill=blur&fit=fill&h=630&w=1200' || true
          cat > out/meta/SOURCE.txt <<'EOF'
          Dailymotion x6nsw5b: AutoMotoTV mirror of 2013 Mercedes-Benz Sprinter assist systems press footage, includes Crosswind Assist; editorial rights check.
          Vimeo 133792996: All Things Media production titled Mercedes-Benz | 2015 Crosswind Assist; rights check required.
          Motorbox image: real red Sprinter on controlled crosswind test track with windsock; editorial rights check.
          FleetOwner image: real black Sprinter Crosswind Assist demonstration vehicle; editorial rights check.
          EOF
          find out -type f -printf '%p\t%s bytes\n'
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailwing-twenty-first-pass
          path: out/
          compression-level: 0
          retention-days: 1
