name: Tailwing verified media bridge twenty-fourth pass
on:
  push:
    paths:
      - '.github/workflows/tailwing_media_bridge_20260830.yml'
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Acquire unique F-15 and B-2 flight media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/videos out/images out/meta
          python -m pip install -q yt-dlp

          yt-dlp --no-playlist -f 'best[height<=720][ext=mp4]/best[height<=720]/best' \
            -o 'out/videos/VID_F15E_AERIAL_DOGFIGHT_PD-USAF.mp4' \
            'https://www.dvidshub.net/video/835409/f-15e-aerials'

          yt-dlp --no-playlist -f 'best[height<=720][ext=mp4]/best[height<=720]/best' \
            -o 'out/videos/VID_B2_INFLIGHT_BROLL_PD-USAF.mp4' \
            'https://www.dvidshub.net/video/505698/b-2-flight-b-roll'

          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1
          ffmpeg -y -loglevel error -ss 00:00:35 -i out/videos/VID_F15E_AERIAL_DOGFIGHT_PD-USAF.mp4 -frames:v 1 -q:v 2 out/images/REAL_F15E_INFLIGHT_AERIAL_PD-USAF.jpg || true
          ffmpeg -y -loglevel error -ss 00:00:08 -i out/videos/VID_B2_INFLIGHT_BROLL_PD-USAF.mp4 -frames:v 1 -q:v 2 out/images/REAL_B2_INFLIGHT_OFFICIAL_PD-USAF.jpg || true

          cat > out/meta/SOURCES.tsv <<'EOF'
          file	source	license
          VID_F15E_AERIAL_DOGFIGHT_PD-USAF.mp4	https://www.dvidshub.net/video/835409/f-15e-aerials	DVIDS / U.S. Air Force / Public Domain
          VID_B2_INFLIGHT_BROLL_PD-USAF.mp4	https://www.dvidshub.net/video/505698/b-2-flight-b-roll	DVIDS / U.S. Air Force / Public Domain
          REAL_F15E_INFLIGHT_AERIAL_PD-USAF.jpg	frame from VID_F15E_AERIAL_DOGFIGHT_PD-USAF.mp4	U.S. Air Force / Public Domain
          REAL_B2_INFLIGHT_OFFICIAL_PD-USAF.jpg	frame from VID_B2_INFLIGHT_BROLL_PD-USAF.mp4	U.S. Air Force / Public Domain
          EOF
          sha256sum out/videos/* out/images/* > out/meta/SHA256SUMS.txt
          find out -type f -printf '%p\t%s bytes\n' | sort
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailwing-twenty-fourth-pass
          path: out/
          compression-level: 0
          retention-days: 1
