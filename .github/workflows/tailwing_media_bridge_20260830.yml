name: Tailwing verified media bridge ninth pass
on:
  push:
    paths:
      - '.github/workflows/tailwing_media_bridge_20260830.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch Mercedes official crosswind assist
        shell: bash
        run: |
          set -u
          mkdir -p out/videos out/meta
          python -m pip install -q yt-dlp
          yt-dlp --no-playlist -f '135+140/135' --merge-output-format mp4 -o 'out/videos/VID_MERCEDES_CROSSWIND_ASSIST_OFFICIAL.%(ext)s' 'https://www.youtube.com/watch?v=SQX3XQywbXY' || true
          printf '%s\n' 'Mercedes-Benz India verified official channel: Get blown away with Crosswind Assist. Real-road crosswind drift and correction demonstration.' > out/meta/SOURCE.txt
          find out -maxdepth 2 -type f -printf '%p\t%s bytes\n' | sort
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailwing-ninth-pass
          path: out/
          compression-level: 0
          retention-days: 1
