name: Tailwing verified media bridge seventeenth pass
on:
  push:
    paths:
      - '.github/workflows/tailwing_media_bridge_20260830.yml'
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install media tools
        run: python -m pip install -q -U yt-dlp
      - name: Acquire NAVAIR produced F35B crosswind mirror
        shell: bash
        run: |
          set -u
          mkdir -p out/videos out/meta
          url='https://www.military.com/video/aircraft/jet-fighters/f-35b-wet-runway-crosswind-testing/3747903883001'
          yt-dlp --no-playlist -f 'bestvideo+bestaudio/best' --merge-output-format mp4 -o 'out/videos/VID_F35B_WET_RUNWAY_CROSSWIND_NAVAIR_PD_MIRROR.%(ext)s' "$url" || true
          printf '%s\n' 'Military.com mirror page identifies video as NAVAIR-produced Pax River ITF footage; F-35B BF-04 wet-runway and extreme-crosswind landing tests, Aug 2014.' > out/meta/SOURCE.txt
          find out -type f -printf '%p\t%s bytes\n'
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailwing-seventeenth-pass
          path: out/
          compression-level: 0
          retention-days: 1
