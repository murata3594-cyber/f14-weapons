name: Tailwing verified media bridge fourth pass
on:
  push:
    paths:
      - '.github/workflows/tailwing_media_bridge_20260830.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch control, maneuver and crosswind media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/videos out/meta
          ua='Mozilla/5.0'
          fetch_dvids() {
            dod="$1"; ym="$2"; outfile="$3"; page="$4"
            for suffix in '1920x1080-6000k.mp4' '1920x1080-5000k.mp4' '1280x720-3000k.mp4' '1280x720-2000k.mp4' '720x480-1500k.mp4'; do
              url="https://d34w7g4gy10iej.cloudfront.net/video/${ym}/${dod}/${dod}-${suffix}"
              if curl -L --fail --retry 2 -A "$ua" -o "$outfile" "$url"; then echo "$url" > "${outfile}.source.txt"; return 0; fi
            done
            python -m pip install -q yt-dlp
            yt-dlp --no-playlist -f 'best[ext=mp4]/best' -o "$outfile" "$page"
            printf '%s\n' "$page" > "${outfile}.source.txt"
          }

          # Fighter slow-motion maneuver package with rolls/loops.
          fetch_dvids 'DOD_109764790' '2307' 'out/videos/VID_F16_VIPER_DEMO_SLOWMO_PD-USAF.mp4' 'https://www.dvidshub.net/video/890360/f-16-viper-demonstration-team-aerial-slow-motion-b-roll'

          # B-2 real motion, takeoff/flight/landing.
          fetch_dvids 'DOD_100020205' '0806' 'out/videos/VID_B2_BROLL_PD-USAF.mp4' 'https://www.dvidshub.net/video/39859/b2-b-roll'

          # Ford official side-wind-stabilisation editorial video cited by Ford Media Center.
          python -m pip install -q yt-dlp
          set +e
          yt-dlp --no-playlist -f 'best[ext=mp4]/best' -o 'out/videos/VID_FORD_TRANSIT_SIDEWIND_EDITORIAL.%(ext)s' 'https://youtu.be/Aka7PXsjrgc'
          echo $? > out/meta/FORD_YOUTUBE_FETCH_EXIT.txt
          set -e

          # NASA Glenn historical control-surface video clips; discover real .mov targets from the official page.
          python - <<'PY'
          import re, urllib.request, urllib.parse, pathlib
          page='https://www.grc.nasa.gov/www/k-12/ControlSurfaces/RadioControl.htm'
          req=urllib.request.Request(page, headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req, timeout=30).read().decode('latin1','ignore')
          hrefs=re.findall(r'href=[\"\']([^\"\']+\.mov)[\"\']', html, flags=re.I)
          out=pathlib.Path('out/videos')
          seen=[]
          for i,h in enumerate(hrefs):
              u=urllib.parse.urljoin(page,h)
              if u in seen: continue
              seen.append(u)
              name=f'VID_NASA_CONTROL_SURFACE_{len(seen):02d}.mov'
              try:
                  req=urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req, timeout=60).read()
                  (out/name).write_bytes(data)
                  (out/(name+'.source.txt')).write_text(u+'\n')
              except Exception as e:
                  pass
          pathlib.Path('out/meta/NASA_MOV_URLS.txt').write_text('\n'.join(seen)+'\n')
          PY

          cat > out/meta/SOURCES.tsv <<'EOF'
          file	section	license_source
          VID_F16_VIPER_DEMO_SLOWMO_PD-USAF.mp4	1-03,2-02,7-02	DVIDS / U.S. Air Force public domain
          VID_B2_BROLL_PD-USAF.mp4	5-03,5-04,5-05 backup	DVIDS / U.S. Air Force public domain
          VID_FORD_TRANSIT_SIDEWIND_EDITORIAL.*	1-07	Ford Media Center official editorial-use video
          VID_NASA_CONTROL_SURFACE_*.mov	1-03,1-05,1-10 backup	NASA Glenn official historical video
          EOF
          sha256sum out/videos/* > out/meta/SHA256SUMS.txt 2>/dev/null || true
          find out -maxdepth 2 -type f -printf '%p\t%s bytes\n' | sort
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailwing-control-crosswind-fourth-pass
          path: out/
          compression-level: 0
          retention-days: 1
