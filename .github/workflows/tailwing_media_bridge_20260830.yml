name: Tailwing verified media bridge twentieth pass
on:
  push:
    paths:
      - '.github/workflows/tailwing_media_bridge_20260830.yml'
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install media tools
        run: python -m pip install -q -U yt-dlp
      - name: Acquire official crosswind vehicle videos
        shell: bash
        run: |
          set -u
          mkdir -p out/videos out/meta
          fetch_youtube() {
            url="$1"; out="$2"
            yt-dlp --no-playlist --extractor-args 'youtube:player_client=tv_embedded,web_embedded,android_vr' -f 'best[height<=1080]/best' --merge-output-format mp4 -o "out/videos/${out}.%(ext)s" "$url" || \
            yt-dlp --no-playlist --extractor-args 'youtube:player_client=web_safari,ios' -f 'best[height<=1080]/best' --merge-output-format mp4 -o "out/videos/${out}.%(ext)s" "$url" || true
          }
          fetch_youtube 'https://www.youtube.com/watch?v=Aka7PXsjrgc' 'VID_FORD_TRANSIT_SIDEWIND_OFFICIAL_EDITORIAL_RIGHTS_CHECK'
          fetch_youtube 'https://www.youtube.com/watch?v=vv5X_BO5kfQ' 'VID_MERCEDES_SPRINTER_CROSSWIND_ASSIST_OFFICIAL_RIGHTS_CHECK'
          cat > out/meta/SOURCE.txt <<'EOF'
          Ford of Europe official video ID Aka7PXsjrgc, linked by Ford Media Center article explaining six-fan crosswind testing up to 80 km/h; Ford Media Center multimedia is editorial-use only.
          Mercedes-Benz Vans Canada official video ID vv5X_BO5kfQ, Crosswind Assist Explained; official channel description says the system detects dangerous wind gusts at highway speeds.
          EOF
          find out -type f -printf '%p\t%s bytes\n'
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailwing-twentieth-pass
          path: out/
          compression-level: 0
          retention-days: 1
