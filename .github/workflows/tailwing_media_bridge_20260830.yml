name: Tailwing verified media bridge twenty-second pass
on:
  push:
    paths:
      - '.github/workflows/tailwing_media_bridge_20260830.yml'
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Acquire Wikimedia rights-cleared media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/videos out/images out/meta
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o 'out/images/REAL_LIGHT_AIRCRAFT_RUDDER_TRIM_CC0.jpg' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Light_aircraft_rudder_and_trim_tab.JPG'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o 'out/images/REAL_LIGHT_AIRCRAFT_ELEVATOR_TRIM_CC0.jpg' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Light_aircraft_elevator_and_trim_tab.JPG'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o 'out/videos/VID_DOOR_FLAP_MECHANISM_PD.webm' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Arm_and_door_flap_demo.webm'
          cat > out/meta/SOURCE.txt <<'EOF'
          REAL_LIGHT_AIRCRAFT_RUDDER_TRIM_CC0.jpg — Wikimedia Commons File:Light aircraft rudder and trim tab.JPG; YSSYguy; CC0.
          REAL_LIGHT_AIRCRAFT_ELEVATOR_TRIM_CC0.jpg — Wikimedia Commons File:Light aircraft elevator and trim tab.JPG; YSSYguy; CC0.
          VID_DOOR_FLAP_MECHANISM_PD.webm — Wikimedia Commons File:Arm and door flap demo.webm; ChandlerSBaird; public domain. Supplemental mechanical-door/flap lever-arm context, not a human finger-vs-hinge demonstration.
          EOF
          sha256sum out/images/* out/videos/* > out/meta/SHA256SUMS.txt
          find out -type f -printf '%p\t%s bytes\n'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailwing-twenty-second-pass
          path: out/
          compression-level: 0
          retention-days: 1
