name: Tailwing verified media bridge nineteenth pass
on:
  push:
    paths:
      - '.github/workflows/tailwing_media_bridge_20260830.yml'
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install media tools
        run: python -m pip install -q -U yt-dlp
      - name: Acquire Ford Transit side-wind test mirror
        shell: bash
        run: |
          set -u
          mkdir -p out/videos out/meta
          url='https://www.gocar.gr/videos/watch/46956%2CFord_Transit_Side_Wind_Stabilisation.html'
          yt-dlp --no-playlist -f 'bestvideo+bestaudio/best' --merge-output-format mp4 -o 'out/videos/VID_FORD_TRANSIT_SIDEWIND_REAL_TEST_EDITORIAL_RIGHTS_CHECK.%(ext)s' "$url" || true
          printf '%s\n' 'Ford Media Center states Transit Side Wind Stabilisation was tested on a special track using six powerful fans producing crosswinds up to 80 km/h and on public roads. Gocar page mirrors/embeds the Ford Transit Side Wind Stabilisation video. Treat reuse as editorial-rights-check.' > out/meta/SOURCE.txt
          find out -type f -printf '%p\t%s bytes\n'
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailwing-nineteenth-pass
          path: out/
          compression-level: 0
          retention-days: 1
