name: Tailwing verified media bridge second pass
on:
  push:
    paths:
      - '.github/workflows/tailwing_media_bridge_20260830.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch exact-match real media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/videos out/images out/meta
          ua='Mozilla/5.0'
          wcurl() { curl -L --fail --retry 4 --retry-delay 2 -A "$ua" -o "$2" "$1"; }
          fetch_dvids() {
            dod="$1"; ym="$2"; outfile="$3"; page="$4"
            for suffix in '1920x1080-6000k.mp4' '1920x1080-5000k.mp4' '1280x720-3000k.mp4' '1280x720-2000k.mp4' '720x480-1500k.mp4'; do
              url="https://d34w7g4gy10iej.cloudfront.net/video/${ym}/${dod}/${dod}-${suffix}"
              if curl -L --fail --retry 2 -A "$ua" -o "$outfile" "$url"; then echo "$url" > "${outfile}.source.txt"; return 0; fi
            done
            python -m pip install -q yt-dlp
            yt-dlp --no-playlist -f 'best[ext=mp4]/best' -o "$outfile" "$page"
            printf '%s\n' "$page" > "${outfile}.source.txt"
          }

          # Exact aerial F-22 demonstration, not taxi/static b-roll.
          fetch_dvids 'DOD_111473422' '2505' 'out/videos/VID_F22_AERIAL_DEMO_PD-USAF.mp4' 'https://www.dvidshub.net/video/992558/f-22-raptor-aerial-demonstration-team-performs-air-dot-show-tour-ft-lauderdale-2025-b-roll'

          # Multiple fighter landing sources for rear/crosswind/rudder QC.
          fetch_dvids 'DOD_108689438' '2111' 'out/videos/VID_F16_DAY_LANDINGS_PD-USAF.mp4' 'https://www.dvidshub.net/video/822145/f-16-daytime-take-offs-and-landings'
          fetch_dvids 'DOD_103258025' '1604' 'out/videos/VID_F18_F15_F4_LANDINGS_PD-USAF.mp4' 'https://www.dvidshub.net/video/461222/aircraft-landing'

          # Real control-surface stills.
          wcurl 'https://commons.wikimedia.org/wiki/Special:Redirect/file/ATR_72_left_aileron_seen_from_rear.jpg' 'out/images/REAL_AILERON_ATR72_rear_CC0.jpg'
          wcurl 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Aileron_horn_of_ATR_72_%28left_wing%29.jpg' 'out/images/REAL_AILERON_ATR72_horn_CC0.jpg'

          # Additional NASA X-36 archival stills to support the exact 1997 sequence.
          wcurl 'https://commons.wikimedia.org/wiki/Special:Redirect/file/X-36_Tailless_Fighter_Agility_Research_Aircraft_on_lakebed_during_high-speed_taxi_tests_DVIDS738104.jpg' 'out/images/REAL_X36_highspeed_taxi_NASA.jpg'

          cat > out/meta/SOURCES.tsv <<'EOF'
          file	section	license_source
          VID_F22_AERIAL_DEMO_PD-USAF.mp4	2-02,3-06,7-02	DVIDS / U.S. Air Force public domain
          VID_F16_DAY_LANDINGS_PD-USAF.mp4	6-02 candidate	DVIDS / U.S. Air Force public domain
          VID_F18_F15_F4_LANDINGS_PD-USAF.mp4	6-02 candidate	DVIDS / U.S. Air Force public domain
          REAL_AILERON_ATR72_rear_CC0.jpg	1-05	Wikimedia Commons CC0
          REAL_AILERON_ATR72_horn_CC0.jpg	1-05 backup	Wikimedia Commons CC0
          REAL_X36_highspeed_taxi_NASA.jpg	5-08 backup	NASA public domain
          EOF
          sha256sum out/videos/* out/images/* > out/meta/SHA256SUMS.txt
          find out -maxdepth 2 -type f -printf '%p\t%s bytes\n' | sort
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailwing-exact-real-media-second-pass
          path: out/
          compression-level: 0
          retention-days: 1
