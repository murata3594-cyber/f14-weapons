name: Tailwing verified media bridge sixteenth pass
on:
  push:
    paths:
      - '.github/workflows/tailwing_media_bridge_20260830.yml'
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install yt-dlp
        run: python -m pip install -q -U yt-dlp
      - name: Acquire NAVAIR official F35B crosswind video
        shell: bash
        run: |
          set -u
          mkdir -p out/videos out/meta
          url='https://www.youtube.com/watch?v=hTT35_AoFhM'
          yt-dlp --no-playlist --extractor-args 'youtube:player_client=android,web_safari' -f 'bestvideo+bestaudio/best' --merge-output-format mp4 -o 'out/videos/VID_F35B_WET_RUNWAY_CROSSWIND_NAVAIR_OFFICIAL.%(ext)s' "$url" || \
          yt-dlp --no-playlist --extractor-args 'youtube:player_client=web_creator' -f 'best[ext=mp4]/best' -o 'out/videos/VID_F35B_WET_RUNWAY_CROSSWIND_NAVAIR_OFFICIAL.%(ext)s' "$url" || true
          printf '%s\n' 'NAVAIRSYSCOM official YouTube: F-35B Wet Runway and Crosswind Landing Tests, Aug 22 2014, BF-04/Pax River ITF.' > out/meta/SOURCE.txt
          find out -type f -printf '%p\t%s bytes\n'
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailwing-sixteenth-pass
          path: out/
          compression-level: 0
          retention-days: 1
