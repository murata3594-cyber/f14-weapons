name: Tailwing verified media bridge eighteenth pass
on:
  push:
    paths:
      - '.github/workflows/tailwing_media_bridge_20260830.yml'
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Acquire China Military Bugle film mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/videos out/meta
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o 'out/videos/VID_CHINA_MILITARY_BUGLE_Y20_J36_FULL_2026.mp4' 'https://v6.huanqiucdn.cn/4394989evodtranscq1500012236/77ec89435001834809244647922/v.f100830.mp4'
          printf '%s\n' 'Full 《啥是大运》 mirror carried by Huanqiu; Huanqiu page attributes source to China Military Bugle. June 28 2026. Final seconds contain the "Little Six" tailless-aircraft cameo. Reuse rights require separate confirmation.' > out/meta/SOURCE.txt
          sha256sum out/videos/* > out/meta/SHA256SUMS.txt
          find out -type f -printf '%p\t%s bytes\n'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailwing-eighteenth-pass
          path: out/
          compression-level: 0
          retention-days: 1
