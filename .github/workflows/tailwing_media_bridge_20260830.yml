name: Tailwing verified media bridge fifteenth pass
on:
  push:
    paths:
      - '.github/workflows/tailwing_media_bridge_20260830.yml'
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Acquire official F35B crosswind images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/images out/meta
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o 'out/images/F35B_CROSSWIND_WET_RUNWAY_USAF_01.jpg' 'https://media.defense.gov/2014/May/15/2000850186/-1/-1/0/140507-F-TW412-035.JPG'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o 'out/images/F35B_CROSSWIND_WET_RUNWAY_USAF_02.jpg' 'https://media.defense.gov/2014/May/15/2000850185/-1/-1/0/140507-F-TW412-135.JPG'
          printf '%s\n' 'Air Force Materiel Command official article, May 15 2014; BF-4 F-35B Crosswind and Wet Runway testing at Edwards AFB; official media.defense.gov high-res images.' > out/meta/SOURCE.txt
          sha256sum out/images/* > out/meta/SHA256SUMS.txt
          find out -type f -printf '%p\t%s bytes\n'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailwing-fifteenth-pass
          path: out/
          compression-level: 0
          retention-days: 1
